[package]
name = "lovelycat"
version = "0.0.1"
edition = "2024"
description = "A GPUI desktop workbench for Hashcat"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
async-channel = "2"
base64 = "0.22"
cfb = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
flate2 = "1"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
hex = "0.4"
lopdf = { version = "0.47", default-features = false }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }
sha2 = "0.10"
tempfile = "3"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[patch.crates-io]
xattr = { path = "patches/xattr" }
