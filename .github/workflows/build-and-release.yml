name: Build & Release Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts as a draft GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lovelycat-windows-x86_64
            platform: windows
            arch: x86_64
            run_tests: true
            upx: true

          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: lovelycat-windows-arm64
            platform: windows
            arch: arm64
            run_tests: true
            upx: false

          - label: macOS Apple Silicon (ARM64)
            os: macos-15
            target: aarch64-apple-darwin
            artifact: lovelycat-macos-arm64
            platform: macos
            arch: arm64
            run_tests: true
            upx: false

          - label: macOS Intel (x64)
            os: macos-15
            target: x86_64-apple-darwin
            artifact: lovelycat-macos-x86_64
            platform: macos
            arch: x86_64
            run_tests: false
            upx: false

          - label: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: lovelycat-linux-x86_64
            platform: linux
            arch: x86_64
            run_tests: true
            upx: true

          - label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: lovelycat-linux-arm64
            platform: linux
            arch: arm64
            run_tests: true
            upx: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GPUI build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            clang \
            libclang-dev \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libzstd-dev \
            upx-ucl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run unit tests
        if: matrix.run_tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Compress Windows binary with UPX
        if: matrix.platform == 'windows' && matrix.upx
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/lovelycat.exe"
          $before = (Get-Item $bin).Length
          $upxUrl = "https://github.com/upx/upx/releases/download/v5.0.0/upx-5.0.0-win64.zip"
          $upxZip = Join-Path $env:RUNNER_TEMP "upx.zip"
          $upxDir = Join-Path $env:RUNNER_TEMP "upx"
          Invoke-WebRequest -Uri $upxUrl -OutFile $upxZip
          Expand-Archive -Path $upxZip -DestinationPath $upxDir -Force
          $upxExe = (Get-ChildItem -Path $upxDir -Recurse -Filter "upx.exe" | Select-Object -First 1).FullName
          & $upxExe --best --lzma $bin
          if ($LASTEXITCODE -ne 0) {
            & $upxExe --best $bin
          }
          & $upxExe -t $bin
          $after = (Get-Item $bin).Length
          Write-Host ("UPX compressed: {0:N2} MB -> {1:N2} MB ({2:N1}%)" -f ($before / 1MB), ($after / 1MB), ($after * 100.0 / $before))

      - name: Compress Linux binary with UPX
        if: matrix.platform == 'linux' && matrix.upx
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/lovelycat"
          BEFORE=$(stat -c%s "$BIN")
          upx --best --lzma "$BIN" || upx --best "$BIN"
          upx -t "$BIN"
          AFTER=$(stat -c%s "$BIN")
          echo "UPX compressed: ${BEFORE} bytes -> ${AFTER} bytes"

      - name: Package Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lovelycat.exe" -Destination $stage
          Copy-Item "README.md" -Destination $stage
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force

      - name: Package macOS release (.app + .dmg + .tar.gz)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_DIR="${RUNNER_TEMP}/Lovelycat.app"
          rm -rf "${APP_DIR}"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"

          cp "target/${{ matrix.target }}/release/lovelycat" "${APP_DIR}/Contents/MacOS/lovelycat"
          chmod +x "${APP_DIR}/Contents/MacOS/lovelycat"

          # Generate macOS .icns icon from assets/lovelycat.png
          ICONSET="${RUNNER_TEMP}/Lovelycat.iconset"
          rm -rf "${ICONSET}"
          mkdir -p "${ICONSET}"
          for size in 16 32 128 256 512; do
            sips -z "${size}" "${size}" assets/lovelycat.png --out "${ICONSET}/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "${double}" "${double}" assets/lovelycat.png --out "${ICONSET}/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "${ICONSET}" -o "${APP_DIR}/Contents/Resources/Lovelycat.icns"

          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="0.0.2"
          fi

          cat > "${APP_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Lovelycat</string>
            <key>CFBundleDisplayName</key>
            <string>Lovelycat</string>
            <key>CFBundleIdentifier</key>
            <string>com.lovelyteams.lovelycat</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>lovelycat</string>
            <key>CFBundleIconFile</key>
            <string>Lovelycat</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          tar -C "${RUNNER_TEMP}" -czf "dist/${{ matrix.artifact }}.tar.gz" "Lovelycat.app"

          DMG_STAGE="${RUNNER_TEMP}/dmg-${{ matrix.arch }}"
          rm -rf "${DMG_STAGE}"
          mkdir -p "${DMG_STAGE}"
          cp -R "${APP_DIR}" "${DMG_STAGE}/"
          ln -s /Applications "${DMG_STAGE}/Applications"
          hdiutil create \
            -volname "Lovelycat" \
            -srcfolder "${DMG_STAGE}" \
            -ov \
            -format UDZO \
            "dist/${{ matrix.artifact }}.dmg"

      - name: Package Linux release
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/${{ matrix.artifact }}"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}" dist

          cp "target/${{ matrix.target }}/release/lovelycat" "${STAGE}/lovelycat"
          chmod +x "${STAGE}/lovelycat"
          cp assets/lovelycat.png "${STAGE}/lovelycat.png"
          cp README.md "${STAGE}/README.md"

          cat > "${STAGE}/lovelycat.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Lovelycat
          Comment=A GPUI desktop workbench for Hashcat
          Exec=lovelycat
          Icon=lovelycat
          Terminal=false
          Categories=Utility;Security;
          EOF

          tar -C "${RUNNER_TEMP}" -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.run_number) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/v') && format('Lovelycat {0}', github.ref_name) || format('Lovelycat Dev Build {0}', github.run_number) }}"
          draft: "${{ !startsWith(github.ref, 'refs/tags/v') }}"
          generate_release_notes: true
          files: release-files/*
